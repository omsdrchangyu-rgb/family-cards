<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fami Heroes</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="Fami Heroes">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFF6EC">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: one column app shell, sticky header, bottom tab bar for parents; card art drawn on canvas at 63×88mm */
:root{
  --bg:#FFF6EC; --surface:#FFFFFF; --ink:#2B2340; --muted:#6E6380; --line:#EADFD2; --chip:#F4ECE2;
  --primary:#2B2340; --primary-ink:#FFF9EF; --accent:#D63C74; --accent-soft:#FFE1EC; --danger:#B8283F;
  --shadow:0 6px 18px rgba(43,35,64,.12);
  --font:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1724; --surface:#262033; --ink:#F3EEF9; --muted:#B8AECB; --line:#3A3250; --chip:#322A44;
    --primary:#F3EEF9; --primary-ink:#1B1724; --accent:#FF7AA6; --accent-soft:#4A2638; --danger:#FF8597;
    --shadow:0 6px 18px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1724; --surface:#262033; --ink:#F3EEF9; --muted:#B8AECB; --line:#3A3250; --chip:#322A44;
  --primary:#F3EEF9; --primary-ink:#1B1724; --accent:#FF7AA6; --accent-soft:#4A2638; --danger:#FF8597;
  --shadow:0 6px 18px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:400 22px "Lilita One","Fredoka",var(--font);letter-spacing:.5px}
.brand-mark{width:34px;height:34px;flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0}
.who strong{color:var(--ink)}
.demo{background:var(--accent-soft);color:var(--ink);font-size:14px;text-align:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}

main{max-width:1100px;margin:0 auto;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h2{font-size:24px;font-weight:900}
.sub{color:var(--muted);font-size:14px;margin:0}

.btn{min-height:44px;border-radius:12px;padding:0 16px;font-weight:700;font-size:16px;border:0;background:var(--chip);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:2px solid currentColor}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--chip);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 14px}
.tile{position:relative;border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile .face{width:100%;aspect-ratio:63/88;border-radius:4.8%/3.4%;background:var(--chip);box-shadow:var(--shadow);display:block;object-fit:cover}
.tile .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.tile .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owners{display:flex;gap:3px;flex:none}
.badge-new{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font:700 13px var(--num);padding:2px 8px;border-radius:999px;box-shadow:var(--shadow)}
.check{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #2B2340;display:grid;place-items:center}
.check svg{width:18px;height:18px;opacity:0}
.tile[aria-pressed="true"] .check{background:#2B2340}
.tile[aria-pressed="true"] .check svg{opacity:1}
.tile[aria-pressed="true"] .face{outline:4px solid var(--accent);outline-offset:2px}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.group h3{font-size:17px;font-weight:900}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.label{font-weight:700;font-size:15px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
input[type=text],input[type=number],input[type=password],input[type=month],select,textarea{min-height:44px;width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:500 16px var(--font);background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.note{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}

.editor{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.preview{display:flex;flex-direction:column;align-items:center;gap:10px}
.preview canvas{width:min(100%,300px);aspect-ratio:63/88;border-radius:4.8%/3.4%;box-shadow:var(--shadow);background:var(--chip)}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.savebar{display:flex;gap:10px;flex-wrap:wrap}
.mini{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:84px;aspect-ratio:63/88;border-radius:5px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:15;border:0;padding:0;background:var(--chip);overflow:hidden}
.mini img{width:100%;height:100%;display:block}
@media (min-width:860px){
  .editor{grid-template-columns:330px minmax(0,1fr);align-items:start}
  .preview{position:sticky;top:76px}
  .mini{display:none}
}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.login h1{font:400 44px "Lilita One","Fredoka",var(--font);letter-spacing:1px}
.fan{position:relative;width:220px;height:170px}
.fan canvas{position:absolute;left:50%;top:0;width:100px;border-radius:5px;box-shadow:var(--shadow)}
.login-actions{display:flex;flex-direction:column;gap:12px;width:min(100%,340px)}
.login-actions .btn{min-height:56px;font-size:18px}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:1.5em}

.kids{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.kid-btn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:900;font-size:18px}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:900 40px var(--font);color:#fff;box-shadow:var(--shadow)}
.avatar.sm{width:40px;height:40px;font-size:18px}

.dex-head{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;align-items:center;gap:16px}
.dex-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dex-head h2{font-size:22px;font-weight:900}
.bar{height:14px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF7A59,#FFC93C,#5CC46B,#4FB3F6);border-radius:999px}
.count{font:700 18px var(--num);font-variant-numeric:tabular-nums}

.kidlist{display:flex;flex-direction:column;gap:10px}
.kidrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kidrow .grow{flex:1;min-width:0}

.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,30,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h3{font-size:20px;font-weight:900}
.big{position:relative;width:min(80vw,360px);aspect-ratio:63/88;margin:0 auto;border-radius:4.8%/3.4%;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35);touch-action:none}
.big canvas,.big img{width:100%;height:100%;display:block}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 44%,rgba(255,214,250,.45) 50%,rgba(190,240,255,.4) 56%,transparent 70%);background-size:260% 260%;mix-blend-mode:screen;animation:shine 4.5s ease-in-out infinite alternate}
.shine.manual{animation:none}
@keyframes shine{from{background-position:0% 0%}to{background-position:100% 100%}}
@media (prefers-reduced-motion: reduce){.shine{animation:none;background-position:40% 40%}}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

.cropper{position:fixed;inset:0;z-index:60;background:#14101C;color:#F3EEF9;display:flex;flex-direction:column}
.cropper-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-weight:700}
.cropper canvas{flex:1;min-height:0;width:100%;touch-action:none;cursor:grab}
.crop-ctl{display:flex;flex-direction:column;gap:10px;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;width:100%;margin:0 auto}
.crop-ctl label{display:grid;grid-template-columns:64px minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:14px}
.crop-ctl output{font:600 14px var(--num);text-align:right}
.crop-ctl input[type=range]{width:100%;accent-color:#FF7AA6}
.cropper .btn{background:#2E2740;color:#F3EEF9}
.cropper .btn.accent{background:#FF7AA6;color:#14101C}

.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.sheetout{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sheetout img{width:100%;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}

.series{display:flex;flex-direction:column;gap:12px}
.series-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.series-head h3{font-size:20px;font-weight:900}
.series-head .bar{flex:1 1 120px;min-width:100px;height:10px}
.done-badge{background:#F2C14E;color:#2B2340;font-weight:900;font-size:13px;padding:2px 10px;border-radius:999px}
.badge-reward{position:absolute;top:-6px;left:-6px;background:#2B2340;color:#F7D774;font:700 12px var(--font);padding:2px 8px;border-radius:999px;box-shadow:var(--shadow)}
.tile.reward-ready .face{outline:4px solid #F2C14E;outline-offset:2px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#FF8A3D}}
.big.flipwrap{overflow:visible;box-shadow:none;perspective:1400px}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateY(180deg) scale(.35)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.8%/3.4%;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.flip .face canvas{width:100%;height:100%;display:block}
.flip .front{transform:translateZ(1px)}
.flip .back{transform:rotateY(180deg) translateZ(1px)}
.flip.play{animation:reveal 2.6s cubic-bezier(.33,.7,.25,1) forwards}
@keyframes reveal{0%{transform:rotateY(180deg) scale(.35) rotate(-14deg)}22%{transform:rotateY(180deg) scale(1.06) rotate(0)}48%{transform:rotateY(180deg) scale(1)}100%{transform:rotateY(720deg) scale(1)}}
.sheet{position:relative}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{top:110%;transform:rotate(760deg)}}
.celebrate{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-block:12px}
.celebrate h3{font:400 40px "Lilita One","Noto Sans TC",var(--font);letter-spacing:1px}
.celebrate p{margin:0;font-size:18px;font-weight:700}
.celebrate-star{width:96px;height:96px}
.celebrate-star svg{width:100%;height:100%}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.tile.reward-ready .face{animation:none}}
.modal.bare{background:rgba(12,9,20,.9);align-items:center}
.modal.bare .sheet{background:transparent;width:auto;max-height:none;overflow:visible;padding:0;border-radius:0;box-shadow:none}
.modal.bare .big{width:min(86vw, calc(78vh * 63 / 88), 440px);cursor:pointer}
.bare-close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.bare-close svg{width:22px;height:22px}
.badge-draft{position:absolute;top:-6px;right:-6px;background:var(--surface);color:var(--ink);border:2px dashed var(--muted);font:700 12px var(--font);padding:1px 8px;border-radius:999px}
.drafts{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--primary-ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;z-index:80;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><svg viewBox="0 0 512 512" class="brand-mark" aria-hidden="true"><defs><linearGradient id="markGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset=".5" stop-color="#FFC03D"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs><path d="M 256.0 40.0 L 317.1 187.9 L 476.6 200.3 L 354.9 304.1 L 392.4 459.7 L 256.0 376.0 L 119.6 459.7 L 157.1 304.1 L 35.4 200.3 L 194.9 187.9 Z" fill="url(#markGold)" stroke="#2B2340" stroke-width="30" stroke-linejoin="round"/><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" transform="translate(194 222) scale(5.2)" fill="#FFFDF7" stroke="#2B2340" stroke-width="1.6" stroke-linejoin="round"/></svg>Fami Heroes</div>
  <div class="who" id="who"></div>
</div></header>
<div class="demo" id="demoBanner" hidden>示範模式：資料只存在這台裝置的瀏覽器裡。接上 Google 後台後，全家共用同一批卡。</div>

<main>
  <section class="view" id="v-login"></section>
  <section class="view" id="v-kidpick" hidden></section>
  <section class="view" id="v-dex" hidden></section>
  <section class="view" id="v-cards" hidden></section>
  <section class="view" id="v-editor" hidden></section>
  <section class="view" id="v-print" hidden></section>
  <section class="view" id="v-kids" hidden></section>
</main>

<nav class="tabbar" id="tabbar" hidden aria-label="主要功能"><div class="tabbar-in">
  <button class="tab" data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="11" height="15" rx="2"></rect><path d="M18 6.5l1.6.6a1 1 0 0 1 .6 1.3l-3.9 10.3a1 1 0 0 1-1.3.6L9 17.5"></path></svg>卡片</button>
  <button class="tab" data-tab="editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>做卡</button>
  <button class="tab" data-tab="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"></path><rect x="3" y="9" width="18" height="8" rx="2"></rect><path d="M7 14h10v7H7z"></path></svg>列印</button>
  <button class="tab" data-tab="kids"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.6-3.5 3-5.5 6-5.5s5.4 2 6 5.5"></path><circle cx="17.5" cy="9.5" r="2.5"></circle><path d="M16.5 14.6c2.4.2 4 1.9 4.5 4.4"></path></svg>設定</button>
</div></nav>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="cropper" id="cropper" hidden>
  <div class="cropper-top"><span id="cropTitle">裁切照片</span><span class="hint" style="color:#B8AECB">拖曳移動，兩指縮放</span></div>
  <canvas id="cropCanvas"></canvas>
  <div class="crop-ctl">
    <label for="cropZoom">放大<input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"><output id="cropZoomOut">1.0×</output></label>
    <label for="cropRot">微調角度<input type="range" id="cropRot" min="-45" max="45" step="0.5" value="0"><output id="cropRotOut">0°</output></label>
    <div class="btnrow">
      <button class="btn" id="cropL" type="button">向左轉 90°</button>
      <button class="btn" id="cropR" type="button">向右轉 90°</button>
    </div>
    <div class="btnrow">
      <button class="btn" id="cropCancel" type="button">取消</button>
      <button class="btn accent" id="cropOk" type="button">使用這張</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

    const pick = () => { KID = DATA.kids.find(k => k.id === dev.kidId) || null; if (KID) { show('dex'); renderDex(); } else { renderKidPick(); show('kidpick'); } };
    if (cache && cache.cards) pick();
    try { await loadData(); ROLE = 'viewer'; pick(); } catch (e) { if (!cache) { renderLogin(); show('login'); } }
    return;
  }
  if (dev && dev.mode === 'parent' && DEMO) { ROLE = 'editor'; await loadData(); enterParent(); return; }
  renderLogin(); show('login');
  if (dev && dev.mode === 'parent' && !DEMO && CONFIG.GOOGLE_CLIENT_ID) { const b = document.querySelector('#v-login .btn.primary'); b && b.click(); }
})();
})();
</script>
